<title id="title">Papua · Ruang cerita dari alam</title>
<desc id="desc">Cenderawasih imajinatif membuka sayap dan bulu panjang di atas dahan hutan. Burung kecil, kupu-kupu, daun dan pantulan sungai memperkaya alam pegunungan. Placeholder alam; tidak menggambarkan cerita rakyat atau detail budaya yang belum diverifikasi. Adegan artistik imajinatif; bukan dokumentasi tempat, busana, atau rekonstruksi sejarah.</desc>
