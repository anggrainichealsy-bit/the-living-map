<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Danau Toba · Janji di antara air dan pegunungan</title>
<desc id="desc">Nelayan di perahu mengangkat tangan menuju ikan ajaib berkilau. Danau luas dan pulau tengah melambangkan latar Danau Toba dan Samosir dalam legenda; pegunungan membingkai suasana tenang. Adegan artistik imajinatif; bukan dokumentasi tempat, busana, atau rekonstruksi sejarah.</desc>
