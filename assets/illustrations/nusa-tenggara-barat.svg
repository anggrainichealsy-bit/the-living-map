<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Putri Mandalika · Cahaya pesisir</title>
<desc id="desc">Putri Mandalika menjadi tokoh utama, berdiri anggun di tebing pantai. Kedua tangan dan kain panjang bergerak tertiup angin; cahaya senja, ombak dan garis nyale simbolis menciptakan suasana puitis. Busana merupakan rekaan artistik. Adegan artistik imajinatif; bukan dokumentasi tempat, busana, atau rekonstruksi sejarah.</desc>
