<stop stop-color="#69567b"/>
<stop offset="1" stop-color="#f4c38e"/>
</linearGradient>
<linearGradient id="water" x2="0" y2="1">
<stop stop-color="#478c8c"/>
<stop offset="1" stop-color="#103f53"/>
</linearGradient>
<linearGradient id="gold" x2=".6" y2="1">
<stop stop-color="#ffedb3"/>
<stop offset="1" stop-color="#bd8748"/>
</linearGradient>
<radialGradient id="glow">
<stop stop-color="#fff6cf" stop-opacity=".65"/>
<stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
</radialGradient>
<pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse">
<circle cx="1" cy="3" r=".6" fill="#f6edcc" opacity=".13"/>
<circle cx="5" cy="7" r=".45" fill="#172f35" opacity=".12"/>
</pattern>
