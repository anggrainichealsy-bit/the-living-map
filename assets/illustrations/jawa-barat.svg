<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Sangkuriang · Perahu menjelang fajar</title>
<desc id="desc">Siluet Sangkuriang mengangkat kaki ke arah perahu terbalik, dengan lengan dan selendang bergerak dramatis. Gunung yang melambangkan Tangkuban Perahu, serpihan kayu dan cahaya menjelang fajar membingkai adegan legenda. Adegan artistik imajinatif; bukan dokumentasi tempat, busana, atau rekonstruksi sejarah.</desc>
