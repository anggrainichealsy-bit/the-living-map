<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Sawerigading · Cakrawala pelayaran</title>
<desc id="desc">Kapal layar imajinatif terinspirasi siluet phinisi menembus ombak. Sosok pelaut di haluan menunjuk cakrawala, dengan kain tertiup angin, layar berlapis dan senja dramatis. Bukan rekonstruksi kapal atau busana dalam naskah Sawerigading. Adegan artistik imajinatif; bukan dokumentasi tempat, busana, atau rekonstruksi sejarah.</desc>
<defs>
<linearGradient id="sky" x2=".2" y2="1">
<stop stop-color="#293b5b"/>
<stop offset="1" stop-color="#e4ad78"/>
</linearGradient>
<linearGradient id="water" x2="0" y2="1">
<stop stop-color="#478c8c"/>
<stop offset="1" stop-color="#103f53"/>
</linearGradient>
<linearGradient id="gold" x2=".6" y2="1">
<stop stop-color="#ffedb3"/>
<stop offset="1" stop-color="#bd8748"/>
</linearGradient>
<radialGradient id="glow">
<stop stop-color="#fff6cf" stop-opacity=".65"/>
<stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
</radialGradient>
