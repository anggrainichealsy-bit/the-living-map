<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Batu Menangis · Jejak kasih di hutan</title>
<desc id="desc">Ibu berwajah sedih mengulurkan tangan kepada anak yang menyesal. Sebagian tubuh anak berubah menjadi batu bersegi dengan air mata terlihat jelas. Jalan hutan dan cahaya redup menekankan hubungan keduanya. Adegan artistik imajinatif; bukan dokumentasi tempat, busana, atau rekonstruksi sejarah.</desc>
